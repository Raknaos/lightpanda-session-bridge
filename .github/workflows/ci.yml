name: Security & CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Relay Security Self-Test
        run: |
          python relay/server.py --self-test
      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v
      - name: Run the acceptance gate (repo checks)
        # version bump consistency, LF shipped tree, i18n parity, popup height,
        # DOM ids, id literals, secret leak: the seams the unit tests cannot see
        run: |
          python scripts/acceptance.py --local
