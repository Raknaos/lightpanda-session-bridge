name: Publish Python Package to PyPI

# Manual only for now: PyPI publication needs a Trusted Publisher configured on
# pypi.org (account owner action). Re-enable `on: release: published` once the
# project is registered there. The build itself is verified by this workflow.
on:
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish Python 🐍 distribution 📦 to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pypa/build
      run: python -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: python -m build
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
