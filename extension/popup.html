<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Lightpanda Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #060b13;
      --ink: #071019;
      --ink-secondary: #243342;
      --soft: #546573;
      --muted: #8295a5;
      --blue: #3579ff;
      --violet: #6b52ff;
      --violet-blue: #5468ff;
      --lilac: #e2d9ff;
      --ice: #c8f7ff;
      --lime: #16a34a;
      --danger: #e11d48;
      --glass-alpha: 0.88;
      --edge: rgba(255, 255, 255, 0.18);
      --edge-strong: rgba(255, 255, 255, 0.35);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      padding: 18px;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #060b13;
      color: #e6edf3;
      font-size: 13px;
      position: relative;
      overflow: hidden;
    }

    /* Dégradé Ambiant Quota Glass (140° Lilas / Cyan / Bleu / Violet) */
    body::before {
      content: '';
      position: absolute;
      width: 280px;
      height: 280px;
      top: -90px;
      left: -60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(107, 82, 255, 0.35) 0%, rgba(53, 121, 255, 0.25) 45%, rgba(200, 247, 255, 0.1) 75%, transparent 100%);
      filter: blur(45px);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      bottom: -60px;
      right: -40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(53, 121, 255, 0.3) 0%, rgba(226, 217, 255, 0.15) 55%, transparent 80%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    .app-card {
      position: relative;
      z-index: 1;
      background: rgba(13, 20, 32, var(--glass-alpha));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--edge);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, #6b52ff, #3579ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(107, 82, 255, 0.4);
    }
    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      background: linear-gradient(135deg, #ffffff 40%, #c8f7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--edge);
    }
    .badge.online {
      background: rgba(22, 163, 74, 0.15);
      border-color: rgba(34, 197, 94, 0.35);
      color: #4ade80;
    }
    .badge.offline {
      background: rgba(225, 29, 72, 0.15);
      border-color: rgba(225, 29, 72, 0.35);
      color: #fb7185;
    }
    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .origin-box {
      background: rgba(7, 16, 25, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 11px 13px;
      margin-bottom: 12px;
    }
    .origin-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }
    .origin-val {
      font-family: 'Space Grotesk', monospace;
      font-size: 12px;
      color: #93c5fd;
      font-weight: 500;
      word-break: break-all;
    }

    .desc {
      font-size: 11.5px;
      color: #94a3b8;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .confirm-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 15px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }
    .confirm-card:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .confirm-card input[type="checkbox"] {
      margin-top: 2px;
      accent-color: var(--violet);
      cursor: pointer;
      width: 15px;
      height: 15px;
    }
    .confirm-card span {
      font-size: 11.5px;
      color: #cbd5e1;
      line-height: 1.35;
    }

    .btn-sync {
      width: 100%;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: linear-gradient(135deg, #6b52ff 0%, #3579ff 100%);
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(107, 82, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-sync:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(107, 82, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      background: linear-gradient(135deg, #7861ff 0%, #4687ff 100%);
    }
    .btn-sync:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-sync:disabled {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.25);
      box-shadow: none;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      font-size: 11.5px;
      min-height: 18px;
      line-height: 1.4;
      word-break: break-word;
      transition: color 0.15s ease;
    }
  </style>
</head>
<body>
  <div class="app-card">
    <div class="header">
      <div class="brand">
        <div class="brand-mark">🐼</div>
        <div class="brand-title">Lightpanda Bridge</div>
      </div>
      <div id="relay-badge" class="badge">
        <span class="dot"></span>
        <span id="relay-text">Vérification…</span>
      </div>
    </div>

    <div class="origin-box">
      <div class="origin-label">Origine cible</div>
      <div class="origin-val" id="origin">Détection en cours…</div>
    </div>

    <p class="desc">
      Transfert chiffré et direct des sessions authentifiées vers le runtime Lightpanda isolé en arrière-plan.
    </p>

    <label class="confirm-card">
      <input id="confirm" type="checkbox">
      <span>J'autorise le transfert sécurisé de cette session vers Lightpanda.</span>
    </label>

    <button id="transfer" class="btn-sync" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
      <span>Synchroniser la session</span>
    </button>

    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
