<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Lightpanda Session Bridge</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --green: #2ea043;
      --green-hover: #3fb950;
      --red: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      width: 350px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 12px;
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .badge.online {
      background: rgba(46, 160, 67, 0.15);
      border-color: rgba(46, 160, 67, 0.4);
      color: #3fb950;
    }
    .badge.offline {
      background: rgba(248, 81, 73, 0.15);
      border-color: rgba(248, 81, 73, 0.4);
      color: var(--red);
    }
    .origin-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .origin-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .origin-val {
      font-family: monospace;
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }
    .notice {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .confirm-wrap {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 14px;
      cursor: pointer;
      user-select: none;
    }
    .confirm-wrap input {
      margin-top: 2px;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: var(--green);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover:not(:disabled) {
      background: var(--green-hover);
    }
    button:disabled {
      background: #21262d;
      border-color: var(--border);
      color: #484f58;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      🐼 Lightpanda Bridge
    </div>
    <div id="relay-badge" class="badge">Vérification relais…</div>
  </div>

  <div class="origin-box">
    <div class="origin-label">Origine cible</div>
    <div class="origin-val" id="origin">Lecture…</div>
  </div>

  <div class="notice">
    Synchronise de façon sécurisée les cookies et l'état de session du site ouvert vers le navigateur Lightpanda isolé.
  </div>

  <label class="confirm-wrap">
    <input id="confirm" type="checkbox">
    <span>J'autorise le transfert des données de session de cette origine vers Lightpanda.</span>
  </label>

  <button id="transfer" disabled>Synchroniser vers Lightpanda</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
